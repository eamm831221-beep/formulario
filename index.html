<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Control GPS</title>
    <style>
        /* Estilos e Identidad Visual basados fielmente en Tally.so */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #ffffff; padding: 20px; box-sizing: border-box; color: #333333; }
        .card { background: #ffffff; padding: 40px 30px; border-radius: 0px; max-width: 420px; width: 100%; box-sizing: border-box; text-align: left; }
        
        .contador-badge { font-size: 13px; font-weight: 500; color: #4f46e5; background-color: #eef2ff; padding: 6px 12px; border-radius: 20px; display: inline-block; margin-bottom: 25px; }
        
        h2 { font-size: 26px; font-weight: 700; color: #111827; margin: 0 0 10px 0; letter-spacing: -0.5px; }
        p { color: #6b7280; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        
        .input-group { margin-bottom: 24px; }
        .input-label { font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px; display: block; }
        .input-label span { color: #ef4444; margin-left: 3px; }
        .input-box { width: 100%; padding: 12px 0px; border: none; border-bottom: 1px solid #d1d5db; font-size: 16px; box-sizing: border-box; color: #111827; background: transparent; transition: border-level 0.2s; }
        .input-box:focus { border-bottom: 2px solid #111827; outline: none; }
        .input-box::placeholder { color: #9ca3af; font-size: 15px; }
        
        .btn { display: inline-block; width: 100%; padding: 14px; background-color: #111827; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 15px; transition: background 0.2s; text-align: center; }
        .btn:active { background-color: #1f2937; }
        
        .historial-box { margin-top: 35px; border-top: 1px solid #e5e7eb; padding-top: 25px; }
        .historial-titulo { font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 15px; letter-spacing: -0.2px; }
        .item-visita { font-size: 14px; color: #4b5563; padding: 10px 0; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
        
        /* Consecutivo estilizado numerado */
        .consecutivo-num { font-weight: 600; color: #9ca3af; margin-right: 8px; font-feature-settings: "tnum"; }
        .item-nombre { color: #111827; font-weight: 400; }
        .item-hora { color: #9ca3af; font-size: 12px; font-feature-settings: "tnum"; }
        
        .btn-reset { background: none; border: none; color: #9ca3af; font-size: 12px; text-decoration: underline; cursor: pointer; margin-top: 25px; display: block; width: 100%; text-align: center; }
        .btn-reset:hover { color: #6b7280; }
    </style>
</head>
<body>

<div class="card">
    <!-- Marcador de visitas del turno -->
    <div class="contador-badge">
        ✨ <span id="badge-total">0</span> visitas en este turno
    </div>
    
    <h2>Datos del Entrevistado</h2>
    <p>Completa los campos obligatorios para activar el GPS y abrir el cuestionario.</p>
    
    <div class="input-group">
        <label class="input-label">Nombre(s) <span>*</span></label>
        <input type="text" id="int-nombre" class="input-box" placeholder="Escribe el nombre o nombres" autocomplete="off">
    </div>
    <div class="input-group">
        <label class="input-label">Apellido Paterno <span>*</span></label>
        <input type="text" id="int-paterno" class="input-box" placeholder="Escribe el apellido paterno" autocomplete="off">
    </div>
    <div class="input-group">
        <label class="input-label">Apellido Materno</label>
        <input type="text" id="int-materno" class="input-box" placeholder="Escribe el apellido materno (opcional)" autocomplete="off">
    </div>
    
    <button class="btn" id="btn-enviar" onclick="avanzarATally()">📝 ABRIR FORMULARIO</button>
    
    <!-- Historial de registros del turno -->
    <div class="historial-box">
        <div class="historial-titulo">📋 Entrevistados en este turno</div>
        <div id="lista-visitas"></div>
    </div>
    
    <button class="btn-reset" onclick="reiniciarContador()">Reiniciar historial manual</button>
</div>

<script>
    // ⚠️ REEMPLAZA EL ENLACE DE ABAJO POR TU DIRECCIÓN PÚBLICA DE COMPARTIR EN TALLY
    const TALLY_URL = "https://tally.so"; 
    
    let urlDestinoFinal = TALLY_URL;

    // 1. LÓGICA DE TURNOS OPERATIVOS (Corte automático a las 2:30 PM de México)
    function obtenerDiaOperativo() {
        const ahora = new Date();
        const tiempoActualEnMinutos = (ahora.getHours() * 60) + ahora.getMinutes();
        const tiempoCorteEnMinutos = (14 * 60) + 30; // 14:30 hrs

        if (tiempoActualEnMinutos < tiempoCorteEnMinutos) {
            ahora.setDate(ahora.getDate() - 1);
        }
        return ahora.toLocaleDateString();
    }

    const diaOperativoActual = obtenerDiaOperativo();
    let visitas = localStorage.getItem("visitas_conteo") ? parseInt(localStorage.getItem("visitas_conteo")) : 0;
    let ultimoDiaOperativo = localStorage.getItem("visitas_dia_operativo");
    let historial = localStorage.getItem("visitas_historial") ? JSON.parse(localStorage.getItem("visitas_historial")) : [];

    if (ultimoDiaOperativo !== diaOperativoActual) {
        visitas = 0;
        historial = [];
        localStorage.setItem("visitas_conteo", 0);
        localStorage.setItem("visitas_historial", JSON.stringify([]));
        localStorage.setItem("visitas_dia_operativo", diaOperativoActual);
    }

    document.getElementById("badge-total").innerText = visitas;
    renderizarHistorial();

    // 2. CAPTURA DEL GPS EN SEGUNDO PLANO (Ahorro de datos al 100%)
    function procesarCoordenadas() {
        const parametrosActuales = window.location.search;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    const cb = "nc=" + new Date().getTime();
                    let urlCalculada = `${TALLY_URL}?lat=${lat}&lon=${lon}&${cb}`;
                    
                    if (parametrosActuales) {
                        const limpio = parametrosActuales.replace('?', '');
                        urlCalculada += `&${limpio}`;
                    }
                    urlDestinoFinal = urlCalculada;
                },
                (error) => {
                    console.warn("Señal de GPS retrasada:", error.message);
                    urlDestinoFinal = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
                },
                { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
            );
        } else {
            urlDestinoFinal = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
        }
    }

    // 3. ACCIÓN AL PRESIONAR EL BOTÓN
    function avanzarATally() {
        const nom = document.getElementById("int-nombre").value.trim();
        const pat = document.getElementById("int-paterno").value.trim();
        const mat = document.getElementById("int-materno").value.trim();
        
        if (nom === "" || pat === "") {
            alert("Por favor, ingresa el Nombre y el Apellido Paterno obligatoriamente.");
            return;
        }
        
        const ahora = new Date();
        const horaTexto = ahora.getHours().toString().padStart(2, '0') + ":" + ahora.getMinutes().toString().padStart(2, '0');

        visitas++;
        localStorage.setItem("visitas_conteo", visitas);

        const nombreCompletoHistorial = `${nom} ${pat} ${mat}`.trim();
        
        // Guardamos el número consecutivo correspondiente en el objeto del historial
        historial.unshift({ numeroConsecutivo: visitas, nombreVisual: nombreCompletoHistorial, hora: horaTexto });
        localStorage.setItem("visitas_historial", JSON.stringify(historial));

        // Acoplamos las variables del entrevistado en la URL hacia los campos ocultos de Tally
        let urlInyectada = urlDestinoFinal + `&nombre=${encodeURIComponent(nom)}&paterno=${encodeURIComponent(pat)}`;
        if (mat !== "") {
            urlInyectada += `&materno=${encodeURIComponent(mat)}`;
        }

        document.getElementById("btn-enviar").disabled = true;
        document.getElementById("btn-enviar").innerText = "Abriendo Formulario Tally...";
        
        window.location.href = urlInyectada;
    }

    // 4. DIBUJAR LA LISTA CON CONSECUTIVOS ORDENADOS
    function renderizarHistorial() {
        const contenedor = document.getElementById("lista-visitas");
        contenedor.innerHTML = "";
        
        if (historial.length === 0) {
            contenedor.innerHTML = '<div style="font-size:14px; color:#9ca3af; text-align:center; padding:15px 0;">No hay registros en este turno.</div>';
            return;
        }

        historial.forEach(item => {
            const div = document.createElement("div");
            div.className = "item-visita";
            // Se concatena el número consecutivo al inicio de cada registro (ej: #1, #2)
            div.innerHTML = `
                <div>
                    <span class="consecutivo-num">#${item.numeroConsecutivo}</span>
                    <span class="item-nombre">${item.nombreVisual}</span>
                </div>
                <span class="item-hora">${item.hora}</span>
            `;
            contenedor.appendChild(div);
        });
    }

    function reiniciarContador() {
        if(confirm("¿Quieres borrar el conteo e historial completo de nombres del teléfono?")) {
localStorage.setItem("visitas_conteo", 0);localStorage.setItem("visitas_historial", JSON.stringify([]));document.getElementById("badge-total").innerText = 0;visitas = 0;historial = [];renderizarHistorial();}}window.onload = procesarCoordenadas;
