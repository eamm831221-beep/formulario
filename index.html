<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Formulario...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f9f9f9; }
        .loader { text-align: center; color: #333; }
    </style>
</head>
<body>

<div class="loader">
    <h2>Abriendo formulario seguro...</h2>
    <p>Por favor, acepta el permiso de ubicación si el navegador lo solicita.</p>
</div>

<script>
    // ⚠️ REEMPLAZA ESTE ENLACE CON EL ENLACE REAL DE TU FORMULARIO DE TALLY (Debe incluir tu /r/XXXXXX)
    const TALLY_URL = "https://tally.so/r/obqGae";

<script>
    // ⚠️ ASEGÚRATE DE COLOCAR TU ENLACE REAL DE TALLY AQUÍ
    const TALLY_URL = "https://tally.so";

    function obtenerUbicacion() {
        const parametrosActuales = window.location.search; 

        if (navigator.geolocation) {
            // Opciones estrictas para encender el chip GPS físico en cada intento
            const geoOpciones = { 
                enableHighAccuracy: true, 
                timeout: 9000, 
                maximumAge: 0 // Prohíbe usar ubicaciones guardadas en la memoria
            };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // 💥 TRUCO ANTI-CACHÉ: Creamos un número único basado en la hora exacta (milisegundos)
                    const cacheBuster = "nocache=" + new Date().getTime();
                    
                    // Construimos la URL uniendo el GPS y el truco anti-caché
                    let urlFinal = `${TALLY_URL}?lat=${lat}&lon=${lon}&${cacheBuster}`;
                    
                    if (parametrosActuales) {
                        const limpio = parametrosActuales.replace('?', '');
                        urlFinal += `&${limpio}`;
                    }
                    
                    window.location.href = urlFinal;
                },
                (error) => {
                    console.warn("Error de GPS o permiso denegado:", error.message);
                    // Si el GPS falla, redirige manteniendo el municipio
                    window.location.href = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
                },
                geoOpciones
            );
        } else {
            window.location.href = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
        }
    }

    // Ejecutar al cargar la página
    window.onload = obtenerUbicacion;
</script>
