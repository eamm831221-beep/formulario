<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Formulario...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f9f9f9; }
        .loader { text-align: center; color: #333; }
    </style>
</head>
<body>

<div class="loader">
    <h2>Abriendo formulario seguro...</h2>
    <p>Por favor, acepta el permiso de ubicación si el navegador lo solicita.</p>
</div>

<script>
    // ⚠️ REEMPLAZA EL ENLACE DE ABAJO CON EL ENLACE REAL DE TU FORMULARIO DE TALLY
    const TALLY_URL = "https://tally.so";

    function obtenerUbicacion() {
        // Captura los parámetros de la URL actual (ej: ?email=eamm831221@gmail.com)
        const parametrosActuales = window.location.search; 

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // Construye la URL uniendo el GPS primero
                    let urlFinal = `${TALLY_URL}?lat=${lat}&lon=${lon}`;
                    
                    // Si el enlace de GitHub traía un correo, lo concatena limpiamente al final usando un "&"
                    if (parametrosActuales) {
                        const limpio = parametrosActuales.replace('?', '');
                        urlFinal += `&${limpio}`;
                    }
                    
                    window.location.href = urlFinal;
                },
                (error) => {
                    // Si el usuario rechaza el GPS, va a Tally manteniendo el correo si existe
                    window.location.href = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            // Navegador no compatible con GPS
            window.location.href = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
        }
    }

    // Ejecutar al cargar la página
    window.onload = obtenerUbicacion;
</script>

</body>
</html>
