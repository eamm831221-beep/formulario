<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Formulario...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f9f9f9; }
        .loader { text-align: center; color: #333; padding: 20px; }
    </style>
</head>
<body>

<div class="loader">
    <h2>Abriendo formulario seguro...</h2>
    <p>Capturando coordenadas GPS en tiempo real...</p>
</div>

<script>
    // ⚠️ REEMPLAZA ESTE ENLACE CON EL ENLACE REAL DE TU FORMULARIO DE TALLY (Debe incluir tu /r/XXXXXX)
    const TALLY_URL = "https://tally.so/r/obqGae";

    function obtenerUbicacion() {
        // Captura automáticamente los parámetros de la URL (?municipio=Tlahualilo)
        const parametrosActuales = window.location.search; 

        if (navigator.geolocation) {
            // getCurrentPosition se ejecuta UNA SOLA VEZ y no genera bucles de datos
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // Une el GPS con tu formulario base agregando un número aleatorio para evitar caché
                    const cb = "nc=" + new Date().getTime();
                    let urlFinal = `${TALLY_URL}?lat=${lat}&lon=${lon}&${cb}`;
                    
                    if (parametrosActuales) {
                        const limpio = parametrosActuales.replace('?', '');
                        urlFinal += `&${limpio}`;
                    }
                    
                    // Salta a Tally inmediatamente y destruye esta pestaña puente
                    window.location.href = urlFinal;
                },
                (error) => {
                    // Si el GPS tarda o falla, redirige de inmediato para no gastar datos intentando conectarse
                    console.warn("Fallo de GPS:", error.message);
                    window.location.href = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
                },
                { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 } // Permite usar un GPS fresco de hasta 1 minuto atrás para ahorrar internet y batería
            );
        } else {
            window.location.href = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
        }
    }

    // Se ejecuta estrictamente una sola vez al cargar la página
    window.onload = obtenerUbicacion;
</script>

</body>
</html>
