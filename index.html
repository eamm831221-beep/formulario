<script>
    // REEMPLAZA ESTE ENLACE CON EL DE TU FORMULARIO REAL DE TALLY
    const TALLY_URL = "https://tally.so/r/obqGae";

    function obtenerUbicacion() {
        const parametrosActuales = window.location.search; 

        if (navigator.geolocation) {
            // USAMOS watchPosition EN LUGAR DE getCurrentPosition PARA FORZAR AL GPS A TRABAJAR EN TIEMPO REAL
            const geoOpciones = { 
                enableHighAccuracy: true, 
                timeout: 8000, 
                maximumAge: 0 // 👈 OBLIGA AL TELÉFONO A NO USAR UBICACIONES VIEJAS EN CACHÉ
            };

            const idReloj = navigator.geolocation.watchPosition(
                (position) => {
                    // Detenemos el reloj de inmediato una vez obtenida la primera coordenada fresca
                    navigator.geolocation.clearWatch(idReloj);

                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    let urlFinal = `${TALLY_URL}?lat=${lat}&lon=${lon}`;
                    if (parametrosActuales) {
                        const limpio = parametrosActuales.replace('?', '');
                        urlFinal += `&${limpio}`;
                    }
                    
                    window.location.href = urlFinal;
                },
                (error) => {
                    navigator.geolocation.clearWatch(idReloj);
                    console.warn("Error de GPS o permiso denegado.");
                    window.location.href = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
                },
                geoOpciones
            );
        } else {
            window.location.href = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
        }
    }

    // Ejecutar al cargar la página normalmente
    window.onload = obtenerUbicacion;
    
    // 📱 TRUCO PARA ANDROID: Si la app ya estaba abierta en segundo plano, esto detecta cuando el usuario vuelve a entrar
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            obtenerUbicacion();
        }
    });
</script>
