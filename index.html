
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Formulario...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f9f9f9; }
        .loader { text-align: center; color: #333; }
    </style>
</head>
<body>

<div class="loader">
    <h2>Abriendo formulario seguro...</h2>
    <p>Por favor, acepta el permiso de ubicación si el navegador lo solicita.</p>
</div>

<script>
    // REEMPLAZA ESTE ENLACE CON EL DE TU FORMULARIO DE TALLY
    const TALLY_URL = "https://tally.so/r/obqGae";

function obtenerUbicacion() {
    // 1. Detectar si el enlace de GitHub trae un correo u otros datos
    const parametrosActuales = window.location.search; 

    // REEMPLAZA ESTO CON TU ENLACE REAL DE TALLY
    const TALLY_BASE = "https://tally.so"; 

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                // Si la URL de GitHub ya trae "?email=...", lo unimos usando "&"
                let urlFinal = `${TALLY_BASE}?lat=${lat}&lon=${lon}`;
                if (parametrosActuales) {
                    // Quita el "?" inicial de los parámetros actuales y los añade al final
                    urlFinal += `&${parametrosActuales.substring(1)}`;
                }
                window.location.href = urlFinal;
            },
            (error) => {
                // Si el usuario deniega el GPS, redirige a Tally manteniendo el correo
                console.warn("Permiso de ubicación denegado.");
                window.location.href = parametrosActuales ? `${TALLY_BASE}${parametrosActuales}` : TALLY_BASE;
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    } else {
        // Navegador antiguo sin GPS: manda a Tally manteniendo el correo
        window.location.href = parametrosActuales ? `${TALLY_BASE}${parametrosActuales}` : TALLY_BASE;
    }
}

    window.onload = obtenerUbicacion;
</script>

</body>
</html>
