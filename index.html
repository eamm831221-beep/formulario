<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Control GPS</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f4f8; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; max-width: 360px; width: 100%; }
        h2 { color: #1e293b; margin-top: 0; font-size: 20px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .contador-box { background-color: #2563eb; padding: 20px; border-radius: 12px; margin-bottom: 20px; color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
        .numero { font-size: 54px; font-weight: bold; display: block; line-height: 1; margin-bottom: 5px; }
        .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; opacity: 0.9; }
        .btn { display: inline-block; width: 100%; padding: 14px; background-color: #0f172a; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn:active { background-color: #1e293b; }
        .btn-reset { background: none; border: none; color: #94a3b8; font-size: 11px; text-decoration: underline; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <!-- El recuadro del contador ahora es azul y muy visible -->
    <div class="contador-box">
        <span id="num-visitas" class="numero">0</span>
        <span class="label">Visitas enviadas hoy</span>
    </div>
    
    <h2>Ubicación Lista</h2>
    <p>Presiona el botón de abajo para registrar tu visita actual con coordenadas en tiempo real.</p>
    
    <!-- El usuario debe presionar este botón para ir a Tally; esto asegura que vea el contador -->
    <button class="btn" id="btn-enviar" onclick="avanzarATally()">📝 ABRIR FORMULARIO</button>
    
    <br>
    <button class="btn-reset" onclick="reiniciarContador()">Reiniciar contador diario a 0</button>
</div>

<script>
    // ⚠️ REEMPLAZA ESTE ENLACE CON TU ENLACE REAL DE TALLY
    const TALLY_URL = "https://tally.so/r/obqGae";
    
    // Variables globales para almacenar la ruta calculada
    let urlDestinoFinal = TALLY_URL;

    // 1. CONTROL DE VISITAS DIARIAS (LocalStorage)
    const fechaHoy = new Date().toLocaleDateString();
    let visitas = localStorage.getItem("visitas_conteo") ? parseInt(localStorage.getItem("visitas_conteo")) : 0;
    let ultimaFecha = localStorage.getItem("visitas_fecha");

    // Si es un día nuevo, se pone en cero automáticamente
    if (ultimaFecha !== fechaHoy) {
        visitas = 0;
        localStorage.setItem("visitas_conteo", 0);
        localStorage.setItem("visitas_fecha", fechaHoy);
    }

    // Dibujar el número actual en la tarjeta al cargar la página
    document.getElementById("num-visitas").innerText = visitas;

    // 2. CAPTURA DEL GPS EN SEGUNDO PLANO
    function procesarCoordenadas() {
        const parametrosActuales = window.location.search;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    const cb = "nc=" + new Date().getTime();
                    let urlCalculada = `${TALLY_URL}?lat=${lat}&lon=${lon}&${cb}`;
                    
                    if (parametrosActuales) {
                        const limpio = parametrosActuales.replace('?', '');
                        urlCalculada += `&${limpio}`;
                    }
                    
                    // Guardamos la URL lista en la variable global
                    urlDestinoFinal = urlCalculada;
                },
                (error) => {
                    console.warn("Fallo de GPS:", error.message);
                    urlDestinoFinal = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
                },
                { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
            );
        } else {
            urlDestinoFinal = parametrosActuales ? `${TALLY_URL}${parametrosActuales}` : TALLY_URL;
        }
    }

    // 3. ACCIÓN AL PRESIONAR EL BOTÓN
    function avanzarATally() {
        // Bloqueamos el botón para evitar doble envío accidental
        document.getElementById("btn-enviar").disabled = true;
        document.getElementById("btn-enviar").innerText = "Cargando...";

        // Sumamos 1 al contador local
        visitas++;
        localStorage.setItem("visitas_conteo", visitas);
        
        // Redirigimos al formulario con los datos acoplados
        window.location.href = urlDestinoFinal;
    }

    function reiniciarContador() {
        if(confirm("¿Quieres reiniciar el contador de hoy a 0?")) {
            localStorage.setItem("visitas_conteo", 0);
            document.getElementById("num-visitas").innerText = 0;
            visitas = 0;
        }
    }

    // Iniciar cálculo del GPS de forma silenciosa al abrir la web
    window.onload = procesarCoordenadas;
</script>

</body>
</html>
